name: Build NeetTracker Microsoft Store MSIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Package Microsoft Store MSIX
        run: npx electron-builder --win appx --x64

      - name: Upload Store Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeetTracker-Store-Package
          path: |
            dist/*.appx
            dist/*.msix
          retention-days: 14
